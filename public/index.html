<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — VRV Dhan Vaibhav Foundation</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png" />
</head>
<body>
<div id="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <h1>Dashboard</h1>
    <p class="pagesub">Overview of loans, collections, and dues.</p>

    <div class="cards" id="stat-cards"></div>

    <div class="panel">
      <div class="panel-flex">
        <h2>Overdue EMIs</h2>
        <a class="link" href="overdue.html">View all &rarr;</a>
      </div>
      <table>
        <thead><tr><th>Customer</th><th>Loan No</th><th>Due Date</th><th class="num">EMI</th><th></th></tr></thead>
        <tbody id="overdue-body"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Upcoming EMIs (next 7 days)</h2>
      <table>
        <thead><tr><th>Customer</th><th>Loan No</th><th>Due Date</th><th class="num">EMI</th><th></th></tr></thead>
        <tbody id="upcoming-body"></tbody>
      </table>
    </div>

    <div class="panel">
      <div class="panel-flex">
        <h2>Recent Loans</h2>
        <a class="link" href="loans.html">View all &rarr;</a>
      </div>
      <table>
        <thead><tr><th>Loan No</th><th>Customer</th><th class="num">Principal</th><th class="num">EMI</th><th>Status</th><th></th></tr></thead>
        <tbody id="recent-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/js/api.js"></script>
<script src="assets/js/format.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
